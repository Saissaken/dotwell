name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  # Also releasable from the Actions tab (or the API): the workflow tags main itself.
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. 1.2.3 (tags main as v1.2.3)
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the build number is the commit count

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            VERSION="${INPUT_VERSION#v}"
            [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Version must look like 1.2.3"; exit 1; }
            [[ "$GITHUB_REF" == refs/heads/main ]] || { echo "::error::Run the release from main"; exit 1; }
            if git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null; then
              echo "::error::v$VERSION already exists"; exit 1
            fi
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_SHA is not on main"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
          mkdir -p build
          scripts/release-notes.sh "$VERSION" > build/notes.md

      - name: Test
        run: swift test

      - name: Bundle app
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
        run: scripts/bundle.sh

      - name: Package
        run: scripts/package.sh "${{ steps.version.outputs.version }}"

      - name: Sign update and write appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ZIP="MacResourceMonitor-$VERSION.zip"
          scripts/appcast.sh "$VERSION" "${{ steps.version.outputs.build }}" "build/$ZIP" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/${{ steps.version.outputs.tag }}/$ZIP" build/notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          # A pushed tag already exists; a manual run creates it on the commit that was built.
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]] && TARGET=(--target "$GITHUB_SHA") || TARGET=(--verify-tag)
          gh release create "$TAG" "${TARGET[@]}" --title "v$VERSION" --notes-file build/notes.md \
            "build/MacResourceMonitor-$VERSION.dmg" "build/MacResourceMonitor-$VERSION.zip" build/appcast.xml
