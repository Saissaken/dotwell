name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', '.github/ISSUE_TEMPLATE/**', 'LICENSE']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Swift version
        run: swift --version
      - name: Lint
        id: lint
        run: make lint
      - name: Show formatting fixes
        if: failure() && steps.lint.outcome == 'failure'
        run: make format && git --no-pager diff
      - name: Test
        run: swift test
      - name: Bundle app
        run: ./scripts/bundle.sh
      - name: Zip
        run: cd build && ditto -c -k --keepParent MacResourceMonitor.app MacResourceMonitor.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MacResourceMonitor
          path: build/MacResourceMonitor.zip
          retention-days: 14
