name: CI

# The macOS runner is expensive: skip it for changes that can't affect the app.
on:
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'site/**', 'Casks/**', 'scripts/build-site.sh', '.github/ISSUE_TEMPLATE/**', '.github/workflows/pages.yml', 'LICENSE']
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'site/**', 'Casks/**', 'scripts/build-site.sh', '.github/ISSUE_TEMPLATE/**', '.github/workflows/pages.yml', 'LICENSE']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Render design mockups (design branch only, not for merge)
        run: swift test --filter "DesignMockupTests|PreviewRenderTests"
        env:
          PREVIEW_DIR: ${{ github.workspace }}/build/previews
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Previews
          path: build/previews
          retention-days: 14
      - name: Commit renders back to the design branch
        if: always()
        run: |
          rm -rf design-renders && mkdir design-renders
          cp build/previews/design/*.png build/previews/settings-*.png design-renders/ || true
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$GITHUB_HEAD_REF"
          git checkout -B "$GITHUB_HEAD_REF" "origin/$GITHUB_HEAD_REF"
          git add design-renders
          git commit -m "chore: design renders [skip ci]" && git push origin "$GITHUB_HEAD_REF" || true
