name: CI

# The macOS runner is expensive: skip it for changes that can't affect the app.
on:
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'site/**', 'Casks/**', 'scripts/build-site.sh', '.github/ISSUE_TEMPLATE/**', '.github/workflows/pages.yml', 'LICENSE']
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'site/**', 'Casks/**', 'scripts/build-site.sh', '.github/ISSUE_TEMPLATE/**', '.github/workflows/pages.yml', 'LICENSE']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Swift version
        run: swift --version
      - name: Lint
        id: lint
        run: make lint
      - name: Show formatting fixes
        if: failure() && steps.lint.outcome == 'failure'
        run: make format && git --no-pager diff
      - name: Test
        run: swift test
        env:
          PREVIEW_DIR: ${{ github.workspace }}/build/previews
      - uses: actions/upload-artifact@v4
        with:
          name: Previews
          path: build/previews
          retention-days: 14
      - name: Commit renders back (temporary, removed before merge)
        if: always() && github.event_name == 'pull_request'
        run: |
          rm -rf /tmp/renders && mkdir /tmp/renders && cp build/previews/*.png /tmp/renders/ || true
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$GITHUB_HEAD_REF"
          git checkout -B "$GITHUB_HEAD_REF" "origin/$GITHUB_HEAD_REF"
          mkdir -p design-renders && cp /tmp/renders/*.png design-renders/
          git add design-renders
          git commit -m "chore: renders [skip ci]" && git push origin "$GITHUB_HEAD_REF" || true
      - name: Bundle app
        run: ./scripts/bundle.sh
      - name: Zip
        run: cd build && ditto -c -k --keepParent Dotwell.app Dotwell.zip
      - uses: actions/upload-artifact@v7
        with:
          name: Dotwell
          path: build/Dotwell.zip
          retention-days: 14
      - name: Release dry run
        run: |
          scripts/package.sh 0.0.0
          # Sign with a throwaway key to exercise the same path as the Release workflow.
          cat > "$RUNNER_TEMP/keygen.swift" <<'SWIFT'
          import CryptoKit
          let key = Curve25519.Signing.PrivateKey()
          print(key.rawRepresentation.base64EncodedString(), key.publicKey.rawRepresentation.base64EncodedString())
          SWIFT
          read -r SPARKLE_PRIVATE_KEY SPARKLE_PUBLIC_KEY < <(swift "$RUNNER_TEMP/keygen.swift")
          export SPARKLE_PRIVATE_KEY SPARKLE_PUBLIC_KEY
          printf -- '- Dry run.\n' > build/notes.md
          scripts/appcast.sh 0.0.0 1 build/Dotwell-0.0.0.zip https://example.com/app.zip build/notes.md
          cat build/appcast.xml
