name: Screenshots

# Renders the popover previews and commits them to docs/images on the chosen branch,
# where the README picks them up.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Render previews
        run: swift test --filter PreviewRenderTests
        env:
          PREVIEW_DIR: ${{ github.workspace }}/docs/images
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images
          if git diff --cached --quiet; then
            echo "Screenshots unchanged"
          else
            git commit -m "docs: update screenshots"
            git push
          fi
